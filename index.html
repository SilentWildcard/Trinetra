<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TRINETRA - Autonomous Safety Guardian</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            trinetra: {
              purple: '#a855f7',
              violet: '#8b5cf6',
              cyan: '#06b6d4',
              crimson: '#ef4444',
              emerald: '#10b981'
            }
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts: Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Trinetra Custom Styles -->
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body class="bg-[#04060d] text-slate-100 flex flex-col items-center justify-center min-h-screen py-3 px-2 sm:py-6 select-none antialiased">

  <!-- Desktop Presentation Header & Simulator Toolbar -->
  <div id="presentation-wrapper" class="w-full flex flex-col items-center">
    <div id="demo-bar-container" class="w-full max-w-lg px-2"></div>

    <!-- Phone Frame Container (Sleek Smartphone Mockup for Laptop Presentation) -->
    <div id="phone-container" class="relative bg-[#050811] rounded-[42px] border-[8px] border-slate-800 shadow-[0_0_50px_rgba(139,92,246,0.25)] flex flex-col overflow-hidden ring-1 ring-purple-500/20">
      
      <!-- Top Speaker Notch / Dynamic Island -->
      <div class="h-6 w-full flex items-center justify-center pt-2 relative z-30 pointer-events-none">
        <div class="w-24 h-4 bg-slate-900 rounded-full flex items-center justify-center border border-slate-800">
          <div class="w-2.5 h-2.5 rounded-full bg-slate-950 border border-slate-700/80 mr-1.5"></div>
          <div class="w-8 h-1 bg-slate-800 rounded-full"></div>
        </div>
      </div>

      <!-- Smartphone Top Status Bar -->
      <div class="h-5 px-6 flex items-center justify-between text-[10px] font-mono text-slate-400 z-30">
        <span class="font-bold text-slate-200">9:41</span>
        <div class="flex items-center gap-1.5">
          <i data-lucide="wifi" class="w-3 h-3 text-slate-300"></i>
          <i data-lucide="battery-charging" class="w-3.5 h-3.5 text-emerald-400"></i>
        </div>
      </div>

      <!-- Active Application Screen Root -->
      <main id="app-screen" class="flex-1 relative overflow-hidden flex flex-col"></main>

      <!-- Bottom Navigation Bar Container -->
      <footer id="bottom-nav-container"></footer>

      <!-- Bottom Phone Home Indicator Bar -->
      <div class="h-4 w-full flex items-center justify-center pb-1 pointer-events-none bg-slate-950/80">
        <div class="w-32 h-1 bg-slate-600/70 rounded-full"></div>
      </div>
    </div>
  </div>

  <!-- Main ES6 Application Entrypoint -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
